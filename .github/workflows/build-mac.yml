# 在 GitHub Actions 的 macOS 服务器上构建 .dmg（无需本地 Mac）。
# 使用方式：
#   1. 把项目推到 GitHub 仓库
#   2. 仓库 Actions 页 → 手动运行本 workflow（Workflow dispatch）
#   3. 构建完成后在 Actions 运行记录里下载 mac-dmg 产物
name: Build macOS dmg

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      # 不签名（无 Apple 开发者证书），跳过代码签名步骤
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend with PyInstaller
        run: |
          cd backend
          pyinstaller backend.spec --noconfirm
          ls -la dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Build dmg
        run: npm run dist:mac

      # 验证 ad-hoc 签名真的生效了。没有这一步，「已损坏」只有用户装的时候才发现。
      # 参见 scripts/afterPack.js：Apple Silicon 上没签名的 arm64 二进制内核直接拒绝加载。
      - name: Verify ad-hoc signature
        run: |
          APP="release/mac-arm64/MistakeNotebook.app"
          [ -d "$APP" ] || APP="release/mac/MistakeNotebook.app"
          echo "检查 $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- .app 签名信息 ---"
          codesign --display --verbose=2 "$APP"
          echo "--- 后端二进制签名信息 ---"
          codesign --display --verbose=2 "$APP/Contents/Resources/backend/mistake-backend"
          # 确认是 ad-hoc（Signature=adhoc），而不是「未签名」
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q "Signature=adhoc" \
            && echo "OK: ad-hoc 签名已生效" \
            || { echo "失败：不是 ad-hoc 签名，装到 Apple Silicon 上会报「已损坏」"; exit 1; }

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
