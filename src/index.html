<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数理化错题本</title>
  <!-- Tailwind CSS 通过 CDN 引入，零构建 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX：公式渲染 + 自动扫描 \( \) \[ \] -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <!-- marked：Markdown 渲染（题目正文可能含 Markdown） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-screen bg-slate-50 text-slate-800">
  <div class="flex h-full">
    <!-- 左侧导航栏 -->
    <aside class="w-56 shrink-0 bg-slate-900 text-slate-200 flex flex-col">
      <div class="px-5 py-5 text-lg font-semibold tracking-wide border-b border-slate-700">
        数理化错题本
      </div>
      <nav class="flex-1 py-4">
        <ul class="space-y-1">
          <li>
            <button class="nav-item active w-full text-left px-5 py-3 hover:bg-slate-800" data-view="notebook">错题本</button>
          </li>
          <li>
            <button class="nav-item w-full text-left px-5 py-3 hover:bg-slate-800" data-view="editor">录入/编辑</button>
          </li>
          <li>
            <button class="nav-item w-full text-left px-5 py-3 hover:bg-slate-800" data-view="similar">举一反三</button>
          </li>
          <li>
            <button class="nav-item w-full text-left px-5 py-3 hover:bg-slate-800" data-view="review">复习计划</button>
          </li>
          <li>
            <button class="nav-item w-full text-left px-5 py-3 hover:bg-slate-800" data-view="settings">设置</button>
          </li>
        </ul>
      </nav>
      <div class="px-5 py-3 text-xs text-slate-500 border-t border-slate-700">
        <span id="backend-status">后端：检测中…</span>
      </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="flex-1 overflow-y-auto">
      <header class="flex items-center justify-between px-8 py-5 bg-white border-b border-slate-200">
        <h1 id="view-title" class="text-xl font-semibold">错题本</h1>
        <button id="refresh-btn" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">
          刷新列表
        </button>
      </header>

      <!-- 视图：错题本 -->
      <section id="view-notebook" class="view p-8">
        <div id="problems-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <!-- 卡片由 render.js 动态注入 -->
        </div>
      </section>

      <!-- 视图：录入/编辑 -->
      <section id="view-editor" class="view p-8 hidden">
        <div class="max-w-3xl mx-auto space-y-6">
          <!-- 上传区 -->
          <div>
            <div id="dropzone"
                 class="dropzone flex flex-col items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-12 px-6 text-center cursor-pointer bg-white">
              <p class="text-slate-600">拖拽文件到此处，或<span class="text-blue-600 font-medium">点击选择</span></p>
              <p class="text-xs text-slate-400">支持 PNG / JPG / PDF / DOCX</p>
              <input id="file-input" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.bmp,.pdf,.docx" class="hidden" />
            </div>
            <div id="preview-wrap" class="mt-3 hidden">
              <img id="preview-img" alt="预览" class="max-h-48 rounded border border-slate-200" />
              <p id="preview-name" class="text-xs text-slate-500 mt-1"></p>
            </div>
            <button id="recognize-btn"
                    class="mt-3 px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
              开始识别
            </button>
            <span id="editor-status" class="ml-3 text-sm text-slate-500"></span>
          </div>

          <!-- AI 结果区 -->
          <div id="result-area" class="hidden space-y-4">
            <div class="bg-white rounded-lg border border-slate-200 p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-sm font-medium text-slate-600">识别结果</span>
                <span id="result-subject" class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600"></span>
                <span id="result-id" class="text-xs text-slate-400"></span>
              </div>
              <div id="result-render" class="text-slate-800 leading-relaxed"></div>
            </div>

            <!-- 自然语言修正 -->
            <div class="bg-white rounded-lg border border-slate-200 p-4">
              <label class="block text-sm font-medium text-slate-600 mb-2">手动修正（自然语言）</label>
              <div class="flex gap-2">
                <input id="correct-input" type="text" placeholder="如：把第二行的系数 2 改成 3"
                       class="flex-1 border border-slate-300 rounded-md px-3 py-2 text-sm" />
                <button id="correct-btn" class="px-4 py-2 text-sm bg-emerald-600 text-white rounded-md hover:bg-emerald-700">
                  提交修正
                </button>
              </div>
            </div>

            <!-- LaTeX 源码编辑 -->
            <div class="bg-white rounded-lg border border-slate-200 p-4">
              <label class="block text-sm font-medium text-slate-600 mb-2">LaTeX 源码（可直接编辑）</label>
              <textarea id="latex-textarea" rows="6"
                        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm font-mono"></textarea>
              <button id="update-latex-btn" class="mt-2 px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">
                更新并重新渲染
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- 视图：设置 -->
      <section id="view-settings" class="view p-8 hidden">
        <div class="max-w-xl space-y-4">
          <p class="text-sm text-slate-500">
            配置兼容 OpenAI 规范的 AI 接口（如 Qwen-VL、Claude、DeepSeek）。识图需模型具备多模态能力。
          </p>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">API Key</label>
            <input id="cfg-api-key" type="password" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Base URL</label>
            <input id="cfg-base-url" type="text" placeholder="https://api.openai.com/v1"
                   class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Model Name</label>
            <input id="cfg-model-name" type="text" placeholder="如 qwen-vl-max / gpt-4o"
                   class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          </div>
          <div class="flex items-center gap-3">
            <button id="save-config-btn" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">
              保存配置
            </button>
            <span id="config-status" class="text-sm text-slate-500"></span>
          </div>
        </div>
      </section>

      <!-- 视图：占位（举一反三 / 复习计划） -->
      <section id="view-placeholder" class="view p-8 hidden">
        <div class="text-center py-16 text-slate-400">
          <p id="placeholder-title" class="text-lg mb-1"></p>
          <p class="text-sm">该功能将在后续阶段实现。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="render.js"></script>
</body>
</html>
